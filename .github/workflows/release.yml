name: Release

# 打 tag v* 时触发：在**原生 runner** 上构建四个平台 → 签名 → 合并清单 → 双镜像发布。
#
# 为什么必须 CI：Windows 需 MSVC 工具链、Linux 需 GTK/WebKitGTK 系统包，
# 本机交叉编译都做不到（实测 Linux 会在 libdbus-sys 处直接 panic）。
#
# 必需仓库 Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          私钥「文件内容」（不是路径！CI 上没有 ~/.tauri/）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码
#   GH_TOKEN                           GitHub 发布权限
#   GITEE_TOKEN                        Gitee 发布权限
#
# 注意：Windows/Linux 目前**划词翻译不可用**（全局热键是 macOS 专属，占位实现）。
# 见 src-tauri/src/app/keyboard_hook_unsupported.rs（`HOOK_SUPPORTED=false`）。发布前请确认这是有意的。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 清单生成/校验的唯一实现，与本地 release.sh 共用
  REPO_GH: restyhap/desktop-02-translation
  REPO_GITEE: restyhap/desktop-02-translation

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundle-args: "--bundles dmg,app"
            platform-key: darwin-aarch64
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundle-args: "--bundles dmg,app"
            platform-key: darwin-x86_64
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # 只出 NSIS：MSI 需 WiX 工具链，且 updater 用 NSIS 即可。
            # 未做 Authenticode 签名 —— 用户装时会遇到 SmartScreen 警告，
            # 这是已知且未解决的问题（与 updater 的 minisign 签名是两回事）。
            bundle-args: "--bundles nsis"
            platform-key: windows-x86_64
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle-args: "--bundles appimage"
            platform-key: linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libdbus-1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libfuse2

      # 用 npm 而非 pnpm：本仓库按 .gitignore 约定**只提交 package-lock.json**
      # （pnpm-lock.yaml 被排除），所以 `cache: pnpm` 与 `--frozen-lockfile`
      # 都会因缺少 pnpm lockfile 而直接失败 —— 2026-10-04 首次 CI 四个平台全挂在这。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 签名：这里必须用「内容」形式。Tauri 文档里的 .env 写法在这里无效，
      # Secrets 不能靠文件注入环境变量。
      - name: Build and sign
        run: npm run tauri -- build --target ${{ matrix.target }} ${{ matrix.bundle-args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ubuntu-22.04 runner 无 FUSE，而 AppImage 打包器（linuxdeploy）自身就是 AppImage，
          # 直接执行会 "fuse: device not found"；extract-and-run 让它解包后再跑。
          APPIMAGE_EXTRACT_AND_RUN: ${{ runner.os == 'Linux' && '1' || '0' }}

      # 产物收集：updater 制品（带签名）+ 各平台安装包（dmg）。用 glob 不硬编码路径，
      # 但必须处理三件事（"首跑必炸" 的坑）：
      # 1) 产物名含空格（"Desktop Translation.app.tar.gz"），`for f in $(find ...)` 会被
      #    词分割拆碎；改用 `-print0` + `read -d ''`。
      # 2) macOS 的 .app.tar.gz 名字里既没版本也没架构，两个架构同名会互相覆盖（上传时
      #    --clobber，清单指向同一文件 → 必有一个架构更新坏掉）；统一改成 release.sh 的
      #    DesktopTranslation_<ver>_<aarch64|x64>.app.tar.gz。
      # 3) dmg 没有 .sig（Tauri 只给 updater 制品签名），按"安装包"单独收集、不配签名。
      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-updater
          found=0
          while IFS= read -r -d '' f; do
            base="$(basename "$f" | tr -d ' ')"
            if [ "$base" = "DesktopTranslation.app.tar.gz" ]; then
              case "${{ matrix.platform-key }}" in
                darwin-aarch64) base="DesktopTranslation_${VERSION}_aarch64.app.tar.gz" ;;
                darwin-x86_64)  base="DesktopTranslation_${VERSION}_x64.app.tar.gz" ;;
              esac
            fi
            case "$f" in
              *.dmg)
                cp "$f" "dist-updater/$base"
                found=$((found+1))
                ;;
              *)
                [ -f "$f.sig" ] || { echo "缺少签名文件，跳过: $f"; continue; }
                cp "$f" "dist-updater/$base"
                cp "$f.sig" "dist-updater/$base.sig"
                found=$((found+1))
                ;;
            esac
          done < <(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \
                     \( -name '*.app.tar.gz' -o -name '*.AppImage' -o -name '*setup.exe' -o -name '*.exe' -o -name '*.dmg' \) \
                     -print0 2>/dev/null)
          [ "$found" -gt 0 ] || { echo "::error::未找到任何可发布产物"; exit 1; }
          ls -la dist-updater

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform-key }}
          path: dist-updater/
          if-no-files-found: error

  publish:
    name: Merge manifest and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build manifest fragments
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p fragments
          for d in artifacts/release-*/; do
            KEY="$(basename "$d" | sed 's/^release-//')"
            for f in "$d"*.sig; do
              [ -e "$f" ] || continue
              ARTIFACT="${f%.sig}"
              # 注意是 ARTIFACT 而非 "$f.sig"：后者等于 sig.sig，永远不存在，
              # 会把所有片段都 continue 掉（首跑会在这里静默产出空清单并失败）。
              [ -f "$ARTIFACT" ] || continue
              node -e '
                const fs = require("fs");
                const [sigPath, out, platform, url] = process.argv.slice(1);
                const raw = fs.readFileSync(sigPath, "utf8").trim();
                const signature = Buffer.from(raw.split("\n").pop(), "base64")
                  .toString("utf8").trim().split("\n").pop().trim();
                fs.writeFileSync(out, JSON.stringify({ platform, url, signature }, null, 2));
              ' "$f" "fragments/$KEY.json" "$KEY" \
                 "https://github.com/$REPO_GH/releases/download/v$VERSION/$(basename "$ARTIFACT")"
              echo "fragment: $KEY -> $(basename "$ARTIFACT")"
            done
          done
          ls -la fragments

      # 校验不过就直接失败、不产出清单 —— 半成品 latest.json 会弄坏**所有**平台的更新
      - name: Merge and validate latest.json
        run: |
          node merge-latest-json.mjs --version "${GITHUB_REF_NAME#v}" \
            --notes "$(git tag -l "${GITHUB_REF_NAME}" --format='%(contents:subject)')" \
            --out latest.json fragments/*.json

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          # 已存在（重跑）则跳过创建；不存在才建，用 tag 注释当 release notes。
          # 旧写法 `create || upload` 在重跑时会让 upload 不带任何文件直接失败。
          if ! gh release view "${GITHUB_REF_NAME}" --repo "$REPO_GH" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "$REPO_GH" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file <(git tag -l "${GITHUB_REF_NAME}" --format='%(contents)')
          fi
          gh release upload "${GITHUB_REF_NAME}" --repo "$REPO_GH" --clobber \
            latest.json $(find artifacts -type f ! -name '*.sig')

      # 清单要 commit 到 main：端点用的是两个镜像的 raw 地址（Gitee 没有
      # /releases/latest/ 这种稳定别名），不推上去客户端就拉不到。
      - name: Push latest.json to both remotes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "chore(release): update latest.json to ${GITHUB_REF_NAME}" || echo "无变化"
          git push origin HEAD:main
          git remote add gitee "https://gitee.com/$REPO_GITEE.git" 2>/dev/null || true
          git push "https://${GITEE_TOKEN}@gitee.com/$REPO_GITEE.git" HEAD:main

      - name: Mirror release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          RID=$(curl -s "https://gitee.com/api/v5/repos/$REPO_GITEE/releases/tags/${GITHUB_REF_NAME}?access_token=$GITEE_TOKEN" | jq -r '.id')
          if [ "$RID" = "null" ]; then
            RID=$(curl -s -X POST "https://gitee.com/api/v5/repos/$REPO_GITEE/releases" \
              -d "access_token=$GITEE_TOKEN" -d "tag_name=${GITHUB_REF_NAME}" \
              -d "name=${GITHUB_REF_NAME}" -d "target_commitish=main" | jq -r '.id')
          fi
          for f in latest.json $(find artifacts -type f ! -name '*.sig'); do
            NAME="$(basename "$f" | tr -d ' ')"
            curl -s -X POST "https://gitee.com/api/v5/repos/$REPO_GITEE/releases/$RID/attach_files" \
              -F "access_token=$GITEE_TOKEN" -F "can_read=true" -F "file=@$f" \
              -o /dev/null -w "  uploaded $NAME: %{http_code}\n"
          done