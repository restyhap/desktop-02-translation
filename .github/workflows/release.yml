name: Release

# 打 tag v* 时触发：在**原生 runner** 上构建四个平台 → 签名 → 合并清单 → 双镜像发布。
#
# 为什么必须 CI：Windows 需 MSVC 工具链、Linux 需 GTK/WebKitGTK 系统包，
# 本机交叉编译都做不到（实测 Linux 会在 libdbus-sys 处直接 panic）。
#
# 必需仓库 Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          私钥「文件内容」（不是路径！CI 上没有 ~/.tauri/）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码
#   GH_TOKEN                           GitHub 发布权限
#   GITEE_TOKEN                        Gitee 发布权限
#
# 注意：Windows/Linux 目前**划词翻译不可用**（全局热键是 macOS 专属，占位实现）。
# 见 src-tauri/src/app/keyboard_hook.rs 的 HOOK_SUPPORTED。发布前请确认这是有意的。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 清单生成/校验的唯一实现，与本地 release.sh 共用
  REPO_GH: restyhap/desktop-02-translation
  REPO_GITEE: restyhap/desktop-02-translation

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundle-args: "--bundles dmg,app"
            platform-key: darwin-aarch64
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundle-args: "--bundles dmg,app"
            platform-key: darwin-x86_64
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # 只出 NSIS：MSI 需 WiX 工具链，且 updater 用 NSIS 即可。
            # 未做 Authenticode 签名 —— 用户装时会遇到 SmartScreen 警告，
            # 这是已知且未解决的问题（与 updater 的 minisign 签名是两回事）。
            bundle-args: "--bundles nsis"
            platform-key: windows-x86_64
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle-args: "--bundles appimage"
            platform-key: linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libdbus-1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 签名：这里必须用「内容」形式。Tauri 文档里的 .env 写法在这里无效，
      # Secrets 不能靠文件注入环境变量。
      - name: Build and sign
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle-args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 产物用 glob 收集，不硬编码路径 —— bundle 目录布局随 Tauri 版本变化，
      # 硬编码是最容易在发版当天炸掉的地方。
      - name: Collect updater artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-updater
          shopt -s nullglob
          # updater 实际消费的制品：macOS 是 .app.tar.gz，Linux 是 AppImage，Windows 是 .exe
          found=0
          for f in $(find src-tauri/target/${{ matrix.target }}/release/bundle -type f \
                       \( -name '*.app.tar.gz' -o -name '*.AppImage' -o -name '*setup.exe' -o -name '*.exe' \) \
                       ! -name '*.sig' 2>/dev/null); do
            sig="$f.sig"
            [ -f "$sig" ] || { echo "缺少签名文件，跳过: $f"; continue; }
            base="$(basename "$f" | tr -d ' ')"
            cp "$f" "dist-updater/$base"
            cp "$sig" "dist-updater/$base.sig"
            found=$((found+1))
          done
          [ "$found" -gt 0 ] || { echo "::error::未找到任何带签名的 updater 制品"; exit 1; }
          ls -la dist-updater

      - uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform-key }}
          path: dist-updater/
          if-no-files-found: error

  publish:
    name: Merge manifest and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build manifest fragments
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p fragments
          for d in artifacts/updater-*/; do
            KEY="$(basename "$d" | sed 's/^updater-//')"
            for f in "$d"*.sig; do
              [ -e "$f" ] || continue
              [ -f "$f.sig" ] || continue
              ARTIFACT="${f%.sig}"
              node -e '
                const fs = require("fs");
                const [sigPath, out, platform, url] = process.argv.slice(1);
                const raw = fs.readFileSync(sigPath, "utf8").trim();
                const signature = Buffer.from(raw.split("\n").pop(), "base64")
                  .toString("utf8").trim().split("\n").pop().trim();
                fs.writeFileSync(out, JSON.stringify({ platform, url, signature }, null, 2));
              ' "$f" "fragments/$KEY.json" "$KEY" \
                 "https://github.com/$REPO_GH/releases/download/v$VERSION/$(basename "$ARTIFACT")"
              echo "fragment: $KEY -> $(basename "$ARTIFACT")"
            done
          done
          ls -la fragments

      # 校验不过就直接失败、不产出清单 —— 半成品 latest.json 会弄坏**所有**平台的更新
      - name: Merge and validate latest.json
        run: |
          node merge-latest-json.mjs --version "${GITHUB_REF_NAME#v}" \
            --notes "$(git tag -l "${GITHUB_REF_NAME}" --format='%(contents:subject)')" \
            --out latest.json fragments/*.json

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$REPO_GH" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file <(git tag -l "${GITHUB_REF_NAME}" --format='%(contents)') \
            || gh release upload "${GITHUB_REF_NAME}" --repo "$REPO_GH" --clobber
          gh release upload "${GITHUB_REF_NAME}" --repo "$REPO_GH" --clobber \
            latest.json $(find artifacts -type f ! -name '*.sig')

      # 清单要 commit 到 main：端点用的是两个镜像的 raw 地址（Gitee 没有
      # /releases/latest/ 这种稳定别名），不推上去客户端就拉不到。
      - name: Push latest.json to both remotes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "chore(release): update latest.json to ${GITHUB_REF_NAME}" || echo "无变化"
          git push origin HEAD:main
          git remote add gitee "https://gitee.com/$REPO_GITEE.git" 2>/dev/null || true
          git push "https://${GITEE_TOKEN}@gitee.com/$REPO_GITEE.git" HEAD:main

      - name: Mirror release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          RID=$(curl -s "https://gitee.com/api/v5/repos/$REPO_GITEE/releases/tags/${GITHUB_REF_NAME}?access_token=$GITEE_TOKEN" | jq -r '.id')
          if [ "$RID" = "null" ]; then
            RID=$(curl -s -X POST "https://gitee.com/api/v5/repos/$REPO_GITEE/releases" \
              -d "access_token=$GITEE_TOKEN" -d "tag_name=${GITHUB_REF_NAME}" \
              -d "name=${GITHUB_REF_NAME}" -d "target_commitish=main" | jq -r '.id')
          fi
          for f in latest.json $(find artifacts -type f ! -name '*.sig'); do
            NAME="$(basename "$f" | tr -d ' ')"
            curl -s -X POST "https://gitee.com/api/v5/repos/$REPO_GITEE/releases/$RID/attach_files" \
              -F "access_token=$GITEE_TOKEN" -F "can_read=true" -F "file=@$f" \
              -o /dev/null -w "  uploaded $NAME: %{http_code}\n"
          done