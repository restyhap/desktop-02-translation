[package]
name = "desktop-translation"
version = "0.1.6"
description = "Desktop Translation App"
authors = ["you"]
edition = "2021"
default-run = "desktop-translation"

[lib]
name = "desktop_translation_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "dictbuild"
path = "src/bin/dictbuild.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 全局快捷键的虚拟键码表（Chromium keycode_converter_data，编译期生成，含 macOS 键码）
keycode = "1"
sqlite = "0.37"
flate2 = "1"
# 进程内读词典资源 zip：原先 shell out 到系统 unzip，而 Windows 没有 unzip。
# zip 4.x 本就已作为传递依赖存在于 lock 文件（tauri 依赖链带入），提为直接依赖不引入新编译单元。
zip = "4"
walkdir = "2"
# moss-tts-nano 仅在非 intel-mac 平台编译：ort-sys 无 x86_64-macos 预编译库；
# MOSS-TTS 已下线且设置页分节已注释，Intel 版走系统语音即可
# moss-tts-nano = "0.1.1"
futures-util = "0.3"

# moss-tts-nano / ort-sys 目前**只有 macOS 可用**：ort-sys 缺 x86_64-macos 预编译库
# （这是它被排除出 Intel 构建的原因），同样也没有 Windows/Linux 预编译包。
# CI 打通 Win/Linux 构建期间这里限定为仅 macOS，否则 ort-sys 会直接构建失败。
# 将来要恢复非 macOS 语音合成，需先确认 ort-sys 为对应平台提供了预编译库。
[target.'cfg(all(target_os = "macos", not(target_arch = "x86_64")))'.dependencies]
moss-tts-nano = "0.1.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.5.0"
# 应用内更新：updater 负责「查版本 + 下载 + 校验 minisign 签名 + 替换 .app」，
# process 提供 relaunch()（更新装完后重启自己）。两者都是纯桌面能力，故与
# window-state 一起挂在 desktop target 块下。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 跨平台构建期需要区分「是否 macOS」：输入监控横幅与更新后重授权提示都只在 macOS 出现
tauri-plugin-os = "2"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
md-5 = "0.10"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }

# 开发模式也启用优化，显著加快 tauri dev 启动速度
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# 发布构建优化（官方模板推荐）
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
