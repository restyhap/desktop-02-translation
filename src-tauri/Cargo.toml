[package]
name = "desktop-translation"
version = "0.1.0"
description = "Desktop Translation App"
authors = ["you"]
edition = "2021"
default-run = "desktop-translation"

[lib]
name = "desktop_translation_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "keyboard-hook"
path = "src/bin/keyboard_hook.rs"

[[bin]]
name = "dictbuild"
path = "src/bin/dictbuild.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
sqlite = "0.37"
flate2 = "1"
walkdir = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
md-5 = "0.10"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }

# 开发模式也启用优化，显著加快 tauri dev 启动速度
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# 发布构建优化（官方模板推荐）
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
