<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="240" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1E1B4B"/>
  <g fill="none" stroke="url(#grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- D = 山：源语言，白色 -->
    <g transform="translate(160,256) scale(0.75)">
      <path d="M -140,120 C -140,20 -100,-100 -30,-120 C 40,-140 100,-60 80,20 C 60,100 -40,120 -80,100"/>
    </g>
    <!-- T = 翼：飞越，天青渐变 -->
    <g transform="translate(360,256) scale(0.92)">
      <path d="M -100,-55 C -60,-112 60,-112 100,-55"/>
      <path d="M 0,-40 L 0,80"/>
    </g>
  </g>
</svg>